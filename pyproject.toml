# `mojo format` is a fork of Black and discovers this file the way Black does, so the width lives
# here rather than in every invocation. It matches `.clang-format`'s ColumnLimit and `.dprint.json`.
[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# cmake-format evaluates its profile with `section` already in scope.
".cmake-format.py" = ["F821"]
