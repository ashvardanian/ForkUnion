[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forkunion"
description = "NUMA-aware fork-join thread pool, shared across Python extensions"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Ash Vardanian" }]
keywords = ["thread-pool", "numa", "parallel", "openmp", "fork-join"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Hardware :: Symmetric Multi-processing",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ashvardanian/ForkUnion"

[tool.setuptools.dynamic]
version = { file = "VERSION" }
