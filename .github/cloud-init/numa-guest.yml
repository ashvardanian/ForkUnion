#cloud-config
# First-boot script for the `test_numa_shapes` VMs in `prerelease.yml`: find the ISO carrying the
# packed checkout, extract it, then build and test it, narrating to the serial console. The host
# reads three sentinels back - `FORKUNION_VM_NODES=N` proves QEMU produced the requested shape,
# `FORKUNION_VM_HARVESTED=N` proves ForkUnion saw the same one, and `FORKUNION_VM_DONE rc=0` is the verdict - so
# this file stays static and needs no per-matrix templating.
runcmd:
  - |
    exec > /dev/console 2>&1
    set -x

    mkdir -p /mnt/repo
    for device in /dev/vdb /dev/vdc; do
      mount -o ro "$device" /mnt/repo 2>/dev/null && [ -f /mnt/repo/repo.tgz ] && break
      umount /mnt/repo 2>/dev/null || true
    done
    tar xzf /mnt/repo/repo.tgz -C /root

    export DEBIAN_FRONTEND=noninteractive
    echo 'Acquire::Retries "3";' > /etc/apt/apt.conf.d/99-retries
    apt-get update -q && apt-get install -yq cmake ninja-build git g++ numactl

    echo "FORKUNION_VM_NODES=$(ls -d /sys/devices/system/node/node* | wc -l) nodes"
    numactl -H

    cd /root
    cmake --preset release
    cmake --build --preset release --target forkunion_test_cpp20 forkunion_test_c11

    # `FORKUNION_VM_NODES` above is sysfs talking to itself. This is the harvest's own count, through the C
    # ABI a downstream would use, and the host holds both to the same number.
    cat > domains.c <<'PROBE'
    #include <stdio.h>
    #include <forkunion.h>
    int main(void) {
        fu_topology_t topology = NULL;
        size_t domains = 0;
        if (fu_topology_new(&topology) != fu_success_k) return 1;
        if (fu_memory_domains_count(topology, &domains) != fu_success_k) return 1;
        printf("FORKUNION_VM_HARVESTED=%zu nodes\n", domains);
        fu_topology_delete(topology);
        return 0;
    }
    PROBE
    gcc -std=c11 -Iinclude domains.c build_release/libforkunion_static.a -lstdc++ -lpthread -latomic -o domains
    ./domains

    ctest --preset release -R '^forkunion_test_(cpp20|c11)$'
    echo "FORKUNION_VM_DONE rc=$?"
    poweroff
