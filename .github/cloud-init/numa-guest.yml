#cloud-config
# First-boot script for the `test_numa_shapes` VMs in `prerelease.yml`: find the ISO carrying the
# packed checkout, extract it, then build and test it, narrating to the serial console. The host
# reads three sentinels back - `FU_VM_NODES=N` proves QEMU produced the requested shape,
# `FU_VM_HARVESTED=N` proves ForkUnion saw the same one, and `FU_VM_DONE rc=0` is the verdict - so
# this file stays static and needs no per-matrix templating.
runcmd:
  - |
    exec > /dev/console 2>&1
    set -x

    mkdir -p /mnt/repo
    for device in /dev/vdb /dev/vdc; do
      mount -o ro "$device" /mnt/repo 2>/dev/null && [ -f /mnt/repo/repo.tgz ] && break
      umount /mnt/repo 2>/dev/null || true
    done
    tar xzf /mnt/repo/repo.tgz -C /root

    export DEBIAN_FRONTEND=noninteractive
    echo 'Acquire::Retries "3";' > /etc/apt/apt.conf.d/99-retries
    apt-get update -q && apt-get install -yq cmake git g++ numactl

    echo "FU_VM_NODES=$(ls -d /sys/devices/system/node/node* | wc -l) nodes"
    numactl -H

    cd /root
    cmake -B build -D CMAKE_BUILD_TYPE=RelWithDebInfo
    cmake --build build --target forkunion_test_cpp17 forkunion_test_cpp20 forkunion_test_c11

    # `FU_VM_NODES` above is sysfs talking to itself. This is the harvest's own count, through the C
    # ABI a downstream would use, and the host holds both to the same number.
    cat > domains.c <<'PROBE'
    #include <stdio.h>
    #include <forkunion.h>
    int main(void) {
        fu_topology_t topology = fu_topology_new();
        if (!topology) return 1;
        printf("FU_VM_HARVESTED=%zu nodes\n", fu_memory_domains_count(topology));
        fu_topology_delete(topology);
        return 0;
    }
    PROBE
    gcc -std=c11 -Iinclude domains.c build/libforkunion_static.a -lstdc++ -lpthread -latomic -o domains
    ./domains

    ctest --test-dir build -R '^forkunion_test_(cpp17|cpp20|c11)$' --output-on-failure
    echo "FU_VM_DONE rc=$?"
    poweroff
