name: Test Docs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build_docs:
    name: Build Docs
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Doxygen
        run: |
          curl -sSfL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: beta-2026-10-18
      # `mojo doc` comes from the same Pixi environment `test-mojo.yml` tests in.
      - name: Set Up Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.62.1
      - name: Build Docs
        run: pixi run .github/scripts/build-docs.sh
      - name: Upload Docs
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: build/forkunion_docs_*.tar.gz
