name: Release

on:
  push:
    branches: ["main"]

env:
  BUILD_TYPE: Release
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            CMakeLists.txt:^\s*VERSION (\d+\.\d+\.\d+)
            Cargo.toml:^version = "(\d+\.\d+\.\d+)"
            CITATION.cff:^version: (\d+\.\d+\.\d+)
            README.md:^\s*GIT_TAG v(\d+\.\d+\.\d+)
            README.md:^\s*forkunion\s*=\s*"(\d+\.\d+\.\d+)"
            README.md:^\s*forkunion\s*=\s*\{\s*version\s*=\s*"(\d+\.\d+\.\d+)"
            README.md:archive/refs/tags/v(\d+\.\d+\.\d+)\.tar\.gz
            build.zig.zon:^\s*\.version = "(\d+\.\d+\.\d+)"
            pixi.toml:^version = "(\d+\.\d+\.\d+)"
            README.md:^\s*forkunion\s*=\s*\{git\s*=\s*"[^"]+",\s*tag\s*=\s*"v(\d+\.\d+\.\d+)"\}
          update-major-version-in: |
            include/forkunion.hpp:^#define FORKUNION_VERSION_MAJOR (\d+)
            include/forkunion/types.hpp:^#define FORKUNION_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            include/forkunion.hpp:^#define FORKUNION_VERSION_MINOR (\d+)
            include/forkunion/types.hpp:^#define FORKUNION_VERSION_MINOR (\d+)
          update-patch-version-in: |
            include/forkunion.hpp:^#define FORKUNION_VERSION_PATCH (\d+)
            include/forkunion/types.hpp:^#define FORKUNION_VERSION_PATCH (\d+)
          dry-run: "false"
          push: "true"
          create-release: "true"
          github-token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  rebase:
    name: Rebase Dev. Branch
    needs: versioning
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Perform rebase
        run: |
          git fetch origin main
          git checkout main-dev
          git rebase origin/main

      - name: Push changes
        uses: CasperWA/push-protected@v2
        with:
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          branch: main-dev
          unprotect_reviews: True
          force: True

  publish_rust:
    name: Publish Rust
    runs-on: ubuntu-24.04
    needs: versioning
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "main"
      # ? `actions-rs` is archived and its Node runtime retired; `dtolnay/rust-toolchain` is the
      # ? maintained replacement the pre-release workflow already uses.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Publish crates
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
