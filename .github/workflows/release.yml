name: Release

on:
  release:
    types: [published]

env:
  BUILD_TYPE: Release
  PYTHONUTF8: 1

permissions:
  contents: read

jobs:
  hooks:
    name: Check Release Commit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check the Release Commit
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME"

  publish_rust:
    name: Publish Rust
    runs-on: ubuntu-26.04
    needs: hooks
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # ? `actions-rs` is archived and its Node runtime retired; `dtolnay/rust-toolchain` is the
      # ? maintained replacement the pre-release workflow already uses.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Authenticate with crates.io
        id: crates_io
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crates
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ steps.crates_io.outputs.token }}
