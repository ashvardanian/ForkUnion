name: Release

on:
  push:
    branches: ["main"]

env:
  BUILD_TYPE: Release
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            CMakeLists.txt:^\s*VERSION (\d+\.\d+\.\d+(?:-rc\.\d+)?)
            Cargo.toml:^version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            CITATION.cff:^version: (\d+\.\d+\.\d+(?:-rc\.\d+)?)
            README.md:^\s*GIT_TAG v(\d+\.\d+\.\d+(?:-rc\.\d+)?)
            README.md:^\s*forkunion\s*=\s*"(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            README.md:^\s*forkunion\s*=\s*\{\s*version\s*=\s*"(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            README.md:archive/refs/tags/v(\d+\.\d+\.\d+(?:-rc\.\d+)?)\.tar\.gz
            build.zig.zon:^\s*\.version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            pixi.toml:^version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            README.md:^\s*forkunion\s*=\s*\{git\s*=\s*"[^"]+",\s*tag\s*=\s*"v(\d+\.\d+\.\d+(?:-rc\.\d+)?)"\}
          update-major-version-in: |
            include/forkunion.hpp:^#define FORKUNION_VERSION_MAJOR (\d+)
            include/forkunion/types.hpp:^#define FORKUNION_VERSION_MAJOR (\d+)
            mojo/forkunion/library.mojo:^comptime BINDING_MAJOR = (\d+)
          update-minor-version-in: |
            include/forkunion.hpp:^#define FORKUNION_VERSION_MINOR (\d+)
            include/forkunion/types.hpp:^#define FORKUNION_VERSION_MINOR (\d+)
          update-patch-version-in: |
            include/forkunion.hpp:^#define FORKUNION_VERSION_PATCH (\d+)
            include/forkunion/types.hpp:^#define FORKUNION_VERSION_PATCH (\d+)
          dry-run: "false"
          push: "true"
          create-release: "true"
          github-token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  rebase:
    name: Rebase Dev. Branch
    needs: versioning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Perform rebase
        run: |
          git fetch origin main
          git checkout main-dev
          git rebase origin/main

      - name: Push changes
        uses: CasperWA/push-protected@v2
        with:
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          branch: main-dev
          unprotect_reviews: True
          force: True

  publish_rust:
    name: Publish Rust
    runs-on: ubuntu-26.04
    needs: versioning
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "main"
      # ? `actions-rs` is archived and its Node runtime retired; `dtolnay/rust-toolchain` is the
      # ? maintained replacement the pre-release workflow already uses.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Publish crates
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build_docs:
    name: Build Docs
    needs: versioning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Doxygen
        run: |
          curl -sSfL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - name: Install Sphinx
        run: pip install -r docs/requirements.txt
      - name: Build Docs
        run: cd docs && doxygen conf.dox && sphinx-build -M html . ../build/docs -W
      - name: Compress Docs
        run: tar -czvf docs.tar.gz build/docs/html/
      - name: Upload Docs to Release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: docs.tar.gz
          update_latest_release: true

  deploy_docs_pages:
    name: Deploy GitHub Pages
    needs: build_docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Download Release Assets
        uses: robinraju/release-downloader@v1.13
        with:
          latest: true
          fileName: docs.tar.gz
      - name: Unpack Docs
        run: tar -xf ./docs.tar.gz
      - name: Set Up GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/docs/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
