name: Pre-Release

on:
  push:
    branches: ["main-dev"]
  pull_request:
    branches: ["main-dev"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3.0.1
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            CMakeLists.txt:^\s*VERSION (\d+\.\d+\.\d+)
            Cargo.toml:^version = "(\d+\.\d+\.\d+)"
            README.md:^\s*GIT_TAG v(\d+\.\d+\.\d+)
            README.md:^\s*forkunion\s*=\s*"(\d+\.\d+\.\d+)"
            README.md:^\s*forkunion\s*=\s*\{\s*version\s*=\s*"(\d+\.\d+\.\d+)"
          update-major-version-in: |
            include/forkunion.hpp:^#define FORKUNION_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            include/forkunion.hpp:^#define FORKUNION_VERSION_MINOR (\d+)
          update-patch-version-in: |
            include/forkunion.hpp:^#define FORKUNION_VERSION_PATCH (\d+)
          dry-run: "true"

  test_ubuntu_gcc:
    name: Ubuntu (GCC)
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build C/C++
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libomp-dev libnuma-dev
          cmake -B build_artifacts -D CMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++
        run: |
          set -euxo pipefail
          build_artifacts/forkunion_test_cpp17
          build_artifacts/forkunion_test_cpp20
          build_artifacts/forkunion_test_cpp23

      - name: Test C
        run: |
          set -euxo pipefail
          build_artifacts/forkunion_test_c11
          build_artifacts/forkunion_test_c_gcc_nested

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc -vV
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

      # Miri interprets the pure-Rust unsafe; the FFI-backed tests are
      # `#[cfg_attr(miri, ignore)]` since Miri cannot call the C shim.
      - name: Test Rust under Miri
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup
          cargo +nightly miri test

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Test Zig
        run: zig build test

      # Sanitizers reuse this job's compiler; restricted to the NUMA-free
      # basic_pool, whose pinned NUMA path stalls under ThreadSanitizer.
      - name: Build & Test under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -euxo pipefail
          cmake -B build_tsan -D CMAKE_BUILD_TYPE=RelWithDebInfo -D FORKUNION_WITH_TOPOLOGY=OFF \
            -D CMAKE_C_FLAGS="-fsanitize=thread -g" -D CMAKE_CXX_FLAGS="-fsanitize=thread -g" \
            -D CMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build_tsan --config RelWithDebInfo --target forkunion_test_cpp17 forkunion_test_cpp20 forkunion_test_cpp23
          build_tsan/forkunion_test_cpp17
          build_tsan/forkunion_test_cpp20
          build_tsan/forkunion_test_cpp23
      - name: Build & Test under Address+UB Sanitizer
        run: |
          set -euxo pipefail
          cmake -B build_asan -D CMAKE_BUILD_TYPE=RelWithDebInfo -D FORKUNION_WITH_TOPOLOGY=OFF \
            -D CMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g" \
            -D CMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g" \
            -D CMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build_asan --config RelWithDebInfo --target forkunion_test_cpp17 forkunion_test_cpp20 forkunion_test_cpp23
          build_asan/forkunion_test_cpp17
          build_asan/forkunion_test_cpp20
          build_asan/forkunion_test_cpp23

  test_ubuntu_clang:
    name: Ubuntu (Clang)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v5

        # C/C++
      - name: Build C/C++
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential clang libclang-rt-18-dev libblocksruntime-dev
          cmake -B build_artifacts -D CMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++
        run: |
          set -euxo pipefail
          build_artifacts/forkunion_test_cpp17
          build_artifacts/forkunion_test_cpp20
          build_artifacts/forkunion_test_cpp23

      - name: Test C
        run: |
          set -euxo pipefail
          build_artifacts/forkunion_test_c11
          build_artifacts/forkunion_test_c_clang_blocks

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc -vV
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

      # Miri interprets the pure-Rust unsafe; the FFI-backed tests are
      # `#[cfg_attr(miri, ignore)]` since Miri cannot call the C shim.
      - name: Test Rust under Miri
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup
          cargo +nightly miri test

      # Sanitizers reuse this job's compiler; restricted to the NUMA-free
      # basic_pool, whose pinned NUMA path stalls under ThreadSanitizer.
      - name: Build & Test under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -euxo pipefail
          cmake -B build_tsan -D CMAKE_BUILD_TYPE=RelWithDebInfo -D FORKUNION_WITH_TOPOLOGY=OFF \
            -D CMAKE_C_FLAGS="-fsanitize=thread -g" -D CMAKE_CXX_FLAGS="-fsanitize=thread -g" \
            -D CMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build_tsan --config RelWithDebInfo --target forkunion_test_cpp17 forkunion_test_cpp20 forkunion_test_cpp23
          build_tsan/forkunion_test_cpp17
          build_tsan/forkunion_test_cpp20
          build_tsan/forkunion_test_cpp23
      - name: Build & Test under Address+UB Sanitizer
        run: |
          set -euxo pipefail
          cmake -B build_asan -D CMAKE_BUILD_TYPE=RelWithDebInfo -D FORKUNION_WITH_TOPOLOGY=OFF \
            -D CMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g" \
            -D CMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g" \
            -D CMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build_asan --config RelWithDebInfo --target forkunion_test_cpp17 forkunion_test_cpp20 forkunion_test_cpp23
          build_asan/forkunion_test_cpp17
          build_asan/forkunion_test_cpp20
          build_asan/forkunion_test_cpp23

  test_ubuntu_arm:
    name: Ubuntu (Arm64, NUMA)
    # Native Arm64 is the only faithful test of the weak memory model the
    # library targets - qemu-user does not reproduce guest memory ordering.
    runs-on: ubuntu-24.04-arm
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build C/C++
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libomp-dev libnuma-dev
          cmake -B build_artifacts -D CMAKE_BUILD_TYPE=RelWithDebInfo -D FORKUNION_WITH_TOPOLOGY=ON
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++
        run: |
          set -euxo pipefail
          build_artifacts/forkunion_test_cpp17
          build_artifacts/forkunion_test_cpp20
          build_artifacts/forkunion_test_cpp23
      - name: Test C
        run: |
          set -euxo pipefail
          build_artifacts/forkunion_test_c11
          build_artifacts/forkunion_test_c_gcc_nested

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc -vV
      - name: Build Rust
        run: cargo build --features numa
      - name: Test Rust
        run: cargo test --features numa

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Test Zig
        run: zig build test -Dnuma=true

  test_macos:
    name: macOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build C/C++
        run: |
          brew update
          brew reinstall cmake
          cmake -B build_artifacts -D CMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++
        run: |
          set -euxo pipefail
          build_artifacts/forkunion_test_cpp17
          build_artifacts/forkunion_test_cpp20
          build_artifacts/forkunion_test_cpp23

      - name: Test C
        run: |
          set -euxo pipefail
          build_artifacts/forkunion_test_c11

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc -vV
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Test Zig
        run: zig build test

  test_macos_llvm_versions:
    name: macOS LLVM Versions
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        llvm: [17, 18, 19, 20, 21]
        config: [Debug, Release, RelWithDebInfo, MinSizeRel]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install LLVM ${{ matrix.llvm }}
        run: |
          brew update
          brew reinstall cmake llvm@${{ matrix.llvm }}

      - name: Build C/C++
        run: |
          cmake -S . -B build_artifacts -D CMAKE_BUILD_TYPE=${{ matrix.config }} -D CMAKE_CXX_COMPILER=$(brew --prefix llvm@${{ matrix.llvm }})/bin/clang++
          cmake --build build_artifacts --config ${{ matrix.config }} --parallel

      - name: Test C++
        run: |
          set -euxo pipefail
          build_artifacts/forkunion_test_cpp17
          build_artifacts/forkunion_test_cpp20
          build_artifacts/forkunion_test_cpp23

      - name: Test C
        run: |
          set -euxo pipefail
          build_artifacts/forkunion_test_c11
          build_artifacts/forkunion_test_c_clang_blocks

  test_windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build C/C++
        run: |
          choco install cmake
          cmake -B build_artifacts -D CMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build_artifacts --config RelWithDebInfo
      - name: List build artifacts
        run: Get-ChildItem -Recurse .\build_artifacts
      - name: Test C++
        run: |
          $ErrorActionPreference = "Stop"
          .\build_artifacts\forkunion_test_cpp17.exe
          .\build_artifacts\forkunion_test_cpp20.exe
          .\build_artifacts\forkunion_test_cpp23.exe

      - name: Test C
        run: |
          Write-Host "MSVC still lacks <stdatomic.h>; skipping C test binary"

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc -vV
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Test Zig
        run: zig build test

  test_windows_msvc_matrix:
    name: Windows MSVC Versions
    # Pinned to windows-2022: this matrix exists to prove the v142 (VS 2019)
    # toolset still compiles, and that toolset isn't guaranteed on windows-2025.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        toolset: [v143, v142] # VS 2022 and VS 2019
        config: [Debug, Release, RelWithDebInfo, MinSizeRel]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build C/C++ with MSVC ${{ matrix.toolset }} (${{ matrix.config }})
        run: |
          choco install cmake
          cmake -B build_artifacts -G "Visual Studio 17 2022" -T ${{ matrix.toolset }} -A x64
          cmake --build build_artifacts --config ${{ matrix.config }}
      - name: List build artifacts
        run: Get-ChildItem -Recurse .\build_artifacts
      - name: Test C++
        run: |
          $ErrorActionPreference = "Stop"
          .\build_artifacts\forkunion_test_cpp17.exe
          .\build_artifacts\forkunion_test_cpp20.exe
          .\build_artifacts\forkunion_test_cpp23.exe

      - name: Test C
        run: |
          Write-Host "MSVC still lacks <stdatomic.h>; skipping C test binary"

  test_i386:
    name: Cross-compilation (i386)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cross-compilation tools
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential gcc-multilib g++-multilib

      - name: Build C++
        run: |
          cmake -B build_i386 -D CMAKE_C_FLAGS=-m32 -D CMAKE_CXX_FLAGS=-m32 -D CMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build_i386 --target forkunion_test_cpp17 forkunion_test_cpp20 forkunion_test_c11

      - name: Test C++
        run: |
          build_i386/forkunion_test_cpp17
          build_i386/forkunion_test_cpp20

      - name: Test C
        run: |
          build_i386/forkunion_test_c11

  test_armhf:
    name: Cross-compilation (armhf)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cross-compilation tools
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user-static

      - name: Build C++
        run: |
          cmake -B build_armhf -D CMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -D CMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ -D CMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build_armhf --target forkunion_test_cpp17 forkunion_test_cpp20 forkunion_test_c11

      - name: Test C++
        run: |
          qemu-arm-static -L /usr/arm-linux-gnueabihf build_armhf/forkunion_test_cpp17
          qemu-arm-static -L /usr/arm-linux-gnueabihf build_armhf/forkunion_test_cpp20

      - name: Test C
        run: |
          qemu-arm-static -L /usr/arm-linux-gnueabihf build_armhf/forkunion_test_c11

  # Every `FU_WITH_*` capability is a switch a downstream build may flip, and each one guards a
  # different kernel facility. The combinations do not collapse: a Linux box without `libnuma` can
  # still pin threads, and a Mac that reports a rich topology can pin nothing at all. Compiling only
  # the default configuration is how `pthread_setaffinity_np` sat behind a NUMA macro for so long.
  test_ubuntu_capabilities:
    name: Ubuntu (Capability Matrix)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auto, libnuma present
            libnuma: true
            flags: ""
          - name: auto, libnuma absent
            libnuma: false
            flags: ""
          - name: no topology
            libnuma: true
            flags: "-DFU_WITH_TOPOLOGY=0"
          - name: no NUMA memory, but still pinning
            libnuma: true
            flags: "-DFU_WITH_NUMA_MEMORY=0"
          - name: no huge pages
            libnuma: true
            flags: "-DFU_WITH_HUGE_PAGES=0"
          - name: no pinning
            libnuma: true
            flags: "-DFU_WITH_THREAD_PINNING=0"
          - name: no metrics
            libnuma: true
            flags: "-DFU_WITH_TOPOLOGY_METRICS=0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y build-essential
          if [ "${{ matrix.libnuma }}" = "true" ]; then sudo apt install -y libnuma-dev; fi

      - name: Build & Test C++ (${{ matrix.name }})
        run: |
          LIBS="-latomic"
          if [ "${{ matrix.libnuma }}" = "true" ]; then LIBS="-lnuma $LIBS"; fi
          g++ -std=c++20 -O2 -Wall -Wextra -Werror ${{ matrix.flags }} -Iinclude scripts/test.cpp -o test_cpp $LIBS
          ./test_cpp

      - name: Build C shim (${{ matrix.name }})
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror ${{ matrix.flags }} -Iinclude -c c/forkunion.cpp -o forkunion.o

      - name: Report the capabilities that survived
        run: |
          LIBS="-latomic"
          if [ "${{ matrix.libnuma }}" = "true" ]; then LIBS="-lnuma $LIBS"; fi
          cat > options.c <<'EOF'
          #include <stdio.h>
          #include "forkunion.h"
          int main(void) {
              printf("comptime: %s\n", fu_comptime_capabilities_string());
              printf("runtime:  %s\n", fu_runtime_capabilities_string());
              return 0;
          }
          EOF
          gcc -std=c11 -Iinclude -c options.c -o options.o
          g++ options.o forkunion.o -o options $LIBS
          ./options

  # A capability nobody can turn off by hand is not a capability. These must be rejected at the
  # `#include`, by an `#error` naming the contradiction - never at link time, with missing symbols.
  test_ubuntu_bad_capabilities:
    name: Ubuntu (Impossible Capabilities)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y build-essential libnuma-dev

      - name: Every contradiction must fail to compile
        run: |
          set -e
          for flags in \
            "-DFU_WITH_TOPOLOGY=0 -DFU_WITH_NUMA_MEMORY=1" \
            "-DFU_WITH_TOPOLOGY=0 -DFU_WITH_TOPOLOGY_METRICS=1" \
            "-DFU_WITH_NUMA_MEMORY=0 -DFU_WITH_HUGE_PAGES=1"; do
            if g++ -std=c++20 $flags -Iinclude -fsyntax-only scripts/test.cpp 2>/dev/null; then
              echo "::error::'$flags' compiled, but describes a build that cannot exist"
              exit 1
            fi
            echo "rejected, as it should be: $flags"
          done

      - name: A typo in a CMake tri-state must fail to configure
        run: |
          if cmake -B build_typo -D FORKUNION_WITH_TOPOLOGY=YES >/dev/null 2>&1; then
            echo "::error::FORKUNION_WITH_TOPOLOGY=YES configured, but YES is not AUTO, ON, or OFF"
            exit 1
          fi
          echo "rejected, as it should be"

  # Rust and Zig express the same tri-state through additive features and through `-D` options, and
  # both must land on the same `fu_comptime_capabilities()`. `portable` is the one that has to hold: it
  # what a caller on an unsupported platform gets, and nothing may depend on a capability it lacks.
  test_bindings_capabilities:
    name: Bindings (Capability Overrides)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y build-essential libnuma-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust (auto)
        run: cargo test --lib

      - name: Test Rust (portable)
        run: cargo test --lib --no-default-features --features portable,std

      - name: Test Rust (forced NUMA memory)
        run: cargo test --lib --features numa-memory

      - name: Reject Rust `portable` alongside a capability it disables
        run: |
          if cargo build --features portable,numa-memory 2>/dev/null; then
            echo "::error::portable and numa-memory built together"
            exit 1
          fi
          echo "rejected, as it should be"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Test Zig (auto)
        run: zig build test

      - name: Test Zig (portable)
        run: zig build test -Dportable=true

  # iOS shares Darwin's `pthread_attr_set_qos_class_np` and `hw.perflevel*`, and shares its refusal
  # to pin. Compiling for the device and for the simulator is enough to keep those paths honest;
  # running is not, because a simulator binary reads the *host* Mac's topology, not a phone's.
  build_ios:
    name: iOS (Compile Only)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build C++ for ${{ matrix.sdk }}
        run: |
          SYSROOT=$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)
          if [ "${{ matrix.sdk }}" = "iphoneos" ]; then TARGET=arm64-apple-ios17.0; \
          else TARGET=arm64-apple-ios17.0-simulator; fi
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -target $TARGET -isysroot "$SYSROOT" \
            -Iinclude -c scripts/test.cpp -o test_ios.o
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -target $TARGET -isysroot "$SYSROOT" \
            -Iinclude -c c/forkunion.cpp -o forkunion_ios.o

  test_s390x:
    name: Cross-compilation (s390x)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cross-compilation tools
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential gcc-s390x-linux-gnu g++-s390x-linux-gnu qemu-user-static

      - name: Build C++
        run: |
          cmake -B build_s390x -D CMAKE_C_COMPILER=s390x-linux-gnu-gcc -D CMAKE_CXX_COMPILER=s390x-linux-gnu-g++ -D CMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build_s390x --target forkunion_test_cpp17 forkunion_test_cpp20 forkunion_test_c11

      - name: Test C++
        run: |
          qemu-s390x-static -L /usr/s390x-linux-gnu build_s390x/forkunion_test_cpp17
          qemu-s390x-static -L /usr/s390x-linux-gnu build_s390x/forkunion_test_cpp20

      - name: Test C
        run: |
          qemu-s390x-static -L /usr/s390x-linux-gnu build_s390x/forkunion_test_c11
